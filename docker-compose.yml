services:
  mysql:
    image: mysql:8.0
    container_name: learn-rebuild-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-raglearn}
      MYSQL_USER: ${MYSQL_USER:-raglearn}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-raglearn-dev-password}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_EXPOSE_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: learn-rebuild-redis
    ports:
      - "${REDIS_EXPOSE_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  mysql_data:
  redis_data:
